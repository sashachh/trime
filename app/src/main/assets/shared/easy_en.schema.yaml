# Rime schema
# encoding: utf-8
# Minimal English schema. Exists mainly so easy_en.dict.yaml gets compiled
# and so you also get a pure-English mode in the schema switcher.

schema:
  schema_id: easy_en
  name: English
  version: "1.0"
  description: |
    Plain English input with word completion.

switches:
  - name: ascii_mode
    reset: 0
    states: [ ABC, ABC ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - recognizer
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " "

translator:
  dictionary: easy_en
  enable_user_dict: true
  enable_completion: true
  enable_sentence: false
  comment_format:
    - "xform/^.+$//"

key_binder:
  import_preset: default

recognizer:
  import_preset: default
